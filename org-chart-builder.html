<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Org Chart Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: drafting-table workspace. Toolbar strip on top, the chart sheet on a gridded board, inspector panel at right (stacks below on phones). */
:root{
  --board:#E9EDF0; --grid:rgba(0,101,77,.08); --panel:#FFFFFF; --field:#F5F7F8;
  --ink:#17212B; --muted:#56616C; --line:#D2D8DE; --accent:#00654D; --accent-ink:#FFFFFF;
  --accent-soft:#DDF5EE; --danger:#A8261D; --danger-soft:#FBEAE8; --shadow:0 1px 2px rgba(20,30,40,.08),0 6px 24px rgba(20,30,40,.10);
  --f-ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --board:#10161B; --grid:rgba(105,254,220,.06); --panel:#172028; --field:#1E2933;
  --ink:#E5EBEF; --muted:#9CA8B3; --line:#2D3A45; --accent:#69FEDC; --accent-ink:#00353E;
  --accent-soft:#123A35; --danger:#F0968E; --danger-soft:#3A1F1D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --board:#10161B; --grid:rgba(105,254,220,.06); --panel:#172028; --field:#1E2933;
  --ink:#E5EBEF; --muted:#9CA8B3; --line:#2D3A45; --accent:#69FEDC; --accent-ink:#00353E;
  --accent-soft:#123A35; --danger:#F0968E; --danger-soft:#3A1F1D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--board);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  display:flex;flex-direction:column;gap:10px;box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.01em;margin-right:6px}
.brand svg{color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.tool-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-left:2px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid var(--line);background:var(--field);border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.btn.icon{padding:0 8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.danger{color:var(--danger);border-color:var(--line);background:var(--field)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn svg{flex:none}
#zoom-label{font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.menu{position:relative}
.menu>summary{list-style:none}
.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:6px;width:270px;display:flex;flex-direction:column;gap:2px}
.pop-item{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer}
.pop-item:hover{background:var(--accent-soft)}
.pop-item small{color:var(--muted);font-size:12px}

/* Main area */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:10px}
#stage{position:relative;min-width:0;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;
  background-color:var(--board);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
#stage-inner{min-width:100%;width:max-content;min-height:100%;box-sizing:border-box;padding:32px}
#board svg{display:block;margin:0 auto;box-shadow:var(--shadow);border-radius:2px;user-select:none;-webkit-user-select:none}
#board .card{cursor:grab;touch-action:none}
#board .card:hover .card-bg{stroke:var(--accent)}
#board .sel-ring{fill:none;stroke:var(--accent);stroke-width:2.5;visibility:hidden}
#board .card.selected .sel-ring{visibility:visible}
#board .card.drop-child .card-bg{stroke:var(--accent);stroke-width:3}
#board .bar-l,#board .bar-r{fill:var(--accent);visibility:hidden}
#board .card.drop-before .bar-l,#board .card.drop-after .bar-r{visibility:visible}
#drop-hint{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent-soft) 85%,transparent);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);pointer-events:none}

/* Inspector */
#panel{min-width:0;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.insp-head code{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:1px 6px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.fld input[type=text],.fld select,.fld textarea{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:34px;box-sizing:border-box;width:100%}
.fld input[type=text]:focus,.fld select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:13px;color:var(--ink);border-right:1px solid var(--line)}
.seg label:last-of-type{border-right:0}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row .btn{flex:1 1 auto;justify-content:center}
.divider{height:1px;background:var(--line);margin:2px 0}
.note-box{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.45}
.groups{display:flex;flex-direction:column;gap:6px}
.grp{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center}
.grp input[type=color]{width:34px;height:34px;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--field);cursor:pointer}
.grp input[type=text]{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px;box-sizing:border-box;width:100%}
.grp .count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input{flex:1;accent-color:var(--accent)}
.range-row output{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:46px;text-align:right}
details.ref summary{cursor:pointer;font-weight:500}
details.ref{font-size:13px;line-height:1.5}
details.ref table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.5px}
details.ref td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
details.ref td:first-child{font-family:var(--f-mono);white-space:nowrap;padding-right:10px}
.tips{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:4px}
kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--field)}

/* Ghost, toast, modal */
#ghost{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);padding:6px 10px;font-size:13px;display:flex;flex-direction:column;max-width:260px}
#ghost span{color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--panel);border-radius:8px;padding:9px 14px;font-size:13.5px;max-width:min(560px,calc(100vw - 32px));box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,16,22,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:12px;padding:18px;box-sizing:border-box}
#modal h2{margin:0;font-size:17px;font-weight:600}
#modal .m-body{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
#modal .m-body p{margin:0;color:var(--muted);font-size:13.5px}
#modal textarea{width:100%;min-height:320px;box-sizing:border-box;font-family:var(--f-mono);font-size:12.5px;line-height:1.5;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;white-space:pre;overflow:auto}
#modal img{max-width:100%;border:1px solid var(--line);background:#fff}
#modal .m-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

@media (max-width: 860px){
  html,body{height:auto}
  .main{grid-template-columns:1fr}
  #stage{height:62vh}
  #panel{overflow:visible}
  .brand{width:100%}
}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="2" width="6" height="4" rx="1"/><rect x="1.5" y="14" width="6" height="4" rx="1"/><rect x="12.5" y="14" width="6" height="4" rx="1"/><path d="M10 6v4M4.5 14v-4h11v4"/></svg>
    <span>Org Chart Builder</span>
  </div>
  <div class="tools">
    <details class="menu" id="new-menu">
      <summary class="btn">New
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>
      </summary>
      <div class="pop">
        <button class="pop-item" type="button" data-new="template">Standard template<small>Typical design-project structure with placeholder names</small></button>
        <button class="pop-item" type="button" data-new="blank">Blank chart<small>A single position to build from</small></button>
      </div>
    </details>
    <button class="btn" type="button" id="b-import">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M2.5 13.5h11"/></svg>Import CSV</button>
    <button class="btn" type="button" id="b-csv-edit">Edit as CSV</button>
    <span class="sep" aria-hidden="true"></span>
    <span class="tool-label">Export</span>
    <button class="btn" type="button" id="b-exp-csv">CSV</button>
    <button class="btn" type="button" id="b-exp-png">PNG</button>
    <button class="btn" type="button" id="b-exp-svg">SVG</button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn icon" type="button" id="b-undo" aria-label="Undo" title="Undo (Ctrl+Z)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3L2 6l3 3"/><path d="M2.5 6H10a4 4 0 010 8H7"/></svg></button>
    <button class="btn icon" type="button" id="b-redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 3l3 3-3 3"/><path d="M13.5 6H6a4 4 0 000 8h3"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="btn icon" type="button" id="b-zout" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    <span id="zoom-label">100%</span>
    <button class="btn icon" type="button" id="b-zin" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
    <button class="btn" type="button" id="b-fit">Fit</button>
  </div>
</header>

<div class="main">
  <section id="stage" aria-label="Org chart canvas">
    <div id="stage-inner"><div id="board"></div></div>
    <div id="drop-hint" hidden>Drop a CSV file to load it</div>
  </section>
  <aside id="panel" aria-label="Inspector"></aside>
</div>

<div id="ghost" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2>
    <div class="m-body" id="m-body"></div>
    <div class="m-actions" id="m-actions"></div>
  </div>
</div>
<input type="file" id="file-in" accept=".csv,text/csv,text/plain" hidden>

<script>
(function(){
'use strict';

/* ---------- Constants ---------- */
/* AECOM theme colors. Base row, then darker shades for extra groups. */
const AECOM={green:'#008768',navy:'#00353E',lime:'#AECC53',red:'#E52713',teal:'#009A9B',yellow:'#FFCE00',
  blue:'#0094AE',blueDark:'#005B6A',greenDark:'#00654D',limeDark:'#89A631',redDark:'#AB1D0E',tealDark:'#007374',yellowDark:'#BF9A00',
  blueTint:'#D2F8FF',greenTint:'#B4FFED',limeTint:'#EEF4DC'};
const PALETTE=[AECOM.green,AECOM.yellow,AECOM.blue,AECOM.lime,AECOM.teal,AECOM.red,AECOM.navy,AECOM.greenDark,AECOM.yellowDark,AECOM.blueDark,AECOM.limeDark,AECOM.redDark];
const SPACING={
  compact:{h:20,v:48,col:10,indent:24,side:28},
  standard:{h:28,v:64,col:14,indent:28,side:40},
  roomy:{h:40,v:84,col:18,indent:32,side:52}
};
const FONT='Arial, Helvetica, sans-serif';
const F={title:'bold 10.5px '+FONT,name:'bold 15px '+FONT,note:'12px '+FONT,h1:'bold 24px '+FONT,sub:'14px '+FONT,leg:'12px '+FONT};
const TITLE_LS=0.6;
const INK={paper:'#FFFFFF',line:'#7F9499',dotted:'#005B6A',border:'#BFCDD0',title:AECOM.blueDark,name:AECOM.navy,note:'#4F6469',
  head:AECOM.navy,sub:'#4F6469',clientFill:AECOM.navy,clientTitle:AECOM.blueTint,extFill:AECOM.blueTint,extBorder:'#7FC9D6',team:'#6F8589',vacant:'#6F8589'};
const KINDS=[['person','Person'],['client','Client / owner'],['team','Team'],['external','External firm'],['vacant','Vacant / TBD']];
const FIELDS=['id','name','title','parent','line','kind','group','layout','note'];
const ALIAS={id:'id',key:'id',positionid:'id',name:'name',fullname:'name',person:'name',employee:'name',
  title:'title',role:'title',position:'title',jobtitle:'title',
  parent:'parent',parentid:'parent',reportsto:'parent',manager:'parent',supervisor:'parent',
  line:'line',linetype:'line',relationship:'line',reporting:'line',
  kind:'kind',type:'kind',cardtype:'kind',style:'kind',
  group:'group',team:'group',department:'group',section:'group',
  layout:'layout',arrange:'layout',children:'layout',
  note:'note',notes:'note',credentials:'note'};
const LS_KEY='org-chart-builder.clean.v1';

const TEMPLATE_CSV=[
'#meta,title,[Project Name]',
'#meta,subtitle,Project Organization Chart | [Client] | [Project No.]',
'#meta,cardwidth,210',
'#group,Project Team,#008768',
'#group,Design Disciplines,#FFCE00',
'id,name,title,parent,line,kind,group,layout,note',
'client,[Client Name],Client,,solid,client,,auto,',
'director,[Name],Project Director,client,solid,person,,auto,',
'pm,[Name],Project Manager,director,solid,person,,auto,',
'advisor,[Name],Technical Advisor,pm,dotted,person,,auto,',
'design-mgr,[Name],Design Manager,pm,solid,person,Project Team,auto,Deputy PM',
'civil-lead,[Name],Civil Lead,design-mgr,solid,person,Project Team,auto,',
'civil-staff,[Name],Civil Staff Engineer,civil-lead,solid,person,Project Team,auto,',
'sw-lead,[Name],Stormwater Lead,design-mgr,solid,person,Project Team,auto,',
'sw-eng,[Name],Stormwater Engineer,sw-lead,solid,person,Project Team,auto,',
'process-mgr,[Name],Process & Permitting Manager,pm,solid,person,Project Team,auto,Deputy PM',
'permit-coord,[Name],Permit Coordinator,process-mgr,solid,person,Project Team,auto,',
'dh-struct,[Name],Structural Dept. Head,pm,solid,person,Design Disciplines,auto,',
'struct-lead,[Name],Structural Lead,dh-struct,solid,person,Design Disciplines,auto,',
'dh-elec,[Name],Electrical Dept. Head,pm,solid,person,Design Disciplines,auto,',
'elec-lead,[Name],Electrical Lead,dh-elec,solid,person,Design Disciplines,auto,',
'dh-ic,[Name],Instrumentation & Controls Dept. Head,pm,solid,person,Design Disciplines,auto,',
'ic-lead,[Name],I&C Lead,dh-ic,solid,person,Design Disciplines,auto,'
].join('\n');


/* ---------- State ---------- */
let state=null, sel=null, zoom=1, SW=0, SH=0, needFit=true;
const undoS=[], redoS=[];
let editPending=false;

function blankState(){return{meta:{title:'',subtitle:'',cardWidth:200,spacing:'standard',legend:true,pngScale:2,stackFrom:0},groups:{},nodes:[],isExample:false};}
const $=s=>document.querySelector(s);
const board=$('#board'), stage=$('#stage'), panel=$('#panel');

/* ---------- Utilities ---------- */
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function slug(s){return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,48);}
function norm(h){return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function byId(id){return state.nodes.find(n=>n.id===id)||null;}
function childrenOf(id){return state.nodes.filter(n=>n.parent===id);}
function inSubtree(nodeId,rootId){let n=byId(nodeId),guard=0;while(n&&guard++<5000){if(n.id===rootId)return true;n=n.parent?byId(n.parent):null;}return false;}
function uid(base){const used=new Set(state.nodes.map(n=>n.id));base=slug(base)||'position';let id=base,k=2;while(used.has(id))id=base+'-'+k++;return id;}
function label(n){return n.name||n.title||n.id;}

let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}
      else f+=c;
    }else{
      if(c==='"'&&f==='')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){row.push(f);f='';rows.push(row);row=[];if(c==='\r'&&text[i+1]==='\n')i++;}
      else f+=c;
    }
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvCell(v){v=String(v??'');return /[",\n\r]|^\s|\s$/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function normLine(v){return /^(dot|dash|advis|indirect|matrix|coord)/i.test(String(v||'').trim())?'dotted':'solid';}
function normKind(v){v=String(v||'').trim().toLowerCase();if(/^client|owner/.test(v))return'client';if(/^team|group/.test(v))return'team';if(/^ext|sub|firm|consult/.test(v))return'external';if(/^vac|tbd|open/.test(v))return'vacant';return'person';}
function normLayout(v){v=String(v||'').trim().toLowerCase();if(/^(row|horiz)/.test(v))return'row';if(/^(col|vert|stack|list)/.test(v))return'column';return'auto';}

function fixCycles(nodes,warn){
  const by=new Map(nodes.map(n=>[n.id,n]));
  for(const n of nodes){
    const seen=new Set([n.id]);let cur=n,p=by.get(cur.parent);
    while(p){if(seen.has(p.id)){warn&&warn.push('Circular reporting found at "'+(cur.name||cur.id)+'". It now sits at the top of the chart.');cur.parent='';break;}seen.add(p.id);cur=p;p=by.get(p.parent);}
  }
}

function csvToState(text){
  const rows=parseCSV(String(text).replace(/^﻿/,''));
  const st=blankState(),warnings=[],recs=[];let header=null;
  for(const r of rows){
    if(!r.length||r.every(c=>!String(c).trim()))continue;
    const first=String(r[0]).trim();
    if(first.startsWith('#')){
      const tag=first.toLowerCase();
      if(tag==='#meta'){
        const k=norm(r[1]),v=String(r[2]??'').trim();
        if(k==='title')st.meta.title=v;
        else if(k==='subtitle')st.meta.subtitle=v;
        else if(k==='cardwidth'){const n=parseInt(v,10);if(n>=140&&n<=320)st.meta.cardWidth=n;}
        else if(k==='spacing'&&SPACING[v.toLowerCase()])st.meta.spacing=v.toLowerCase();
        else if(k==='legend')st.meta.legend=!/^(no|false|0|off|hide)$/i.test(v);
        else if(k==='pngscale'){const n=parseInt(v,10);if(n>=1&&n<=4)st.meta.pngScale=n;}
        else if(k==='stackfrom'){const n=parseInt(v,10);st.meta.stackFrom=(n>=2&&n<=8)?n:0;}
      }else if(tag==='#group'){
        const name=String(r[1]||'').trim(),col=String(r[2]||'').trim();
        if(name&&/^#[0-9a-f]{6}$/i.test(col))st.groups[name]=col.toUpperCase();
      }
      continue;
    }
    if(!header){
      header=r.map(h=>ALIAS[norm(h)]||null);
      if(!header.includes('name')&&!header.includes('title'))throw new Error('No header row found. The first row (after any # lines) should name the columns, for example: id, name, title, parent.');
      continue;
    }
    const o={};header.forEach((fld,i)=>{if(fld&&o[fld]===undefined)o[fld]=String(r[i]??'').trim();});
    if(!o.name&&!o.title&&!o.id)continue;
    recs.push(o);
  }
  if(!header)throw new Error('The file has no rows to read.');
  const used=new Set(),nodes=[],rawMap=new Map();
  for(const o of recs){
    let base=(o.id||'').trim().replace(/\s+/g,'-')||slug(o.name||o.title)||'position',id=base,k=2;
    while(used.has(id))id=base+'-'+k++;
    if(o.id&&id!==o.id)warnings.push('Duplicate id "'+o.id+'" renamed to "'+id+'".');
    used.add(id);
    const n={id,name:o.name||'',title:o.title||'',parent:o.parent||'',line:normLine(o.line),kind:normKind(o.kind),group:o.group||'',layout:normLayout(o.layout),note:o.note||''};
    if(o.id&&!rawMap.has(o.id.toLowerCase()))rawMap.set(o.id.toLowerCase(),n);
    nodes.push(n);
  }
  const idMap=new Map(nodes.map(n=>[n.id.toLowerCase(),n]));
  const nameMap=new Map();nodes.forEach(n=>{if(n.name&&!nameMap.has(n.name.toLowerCase()))nameMap.set(n.name.toLowerCase(),n);});
  for(const n of nodes){
    if(!n.parent)continue;
    const p=n.parent.toLowerCase(),t=rawMap.get(p)||idMap.get(p)||nameMap.get(p);
    if(t&&t!==n)n.parent=t.id;
    else{warnings.push('"'+label(n)+'" reports to "'+n.parent+'", which is not in the file. It now sits at the top.');n.parent='';}
  }
  fixCycles(nodes,warnings);
  st.nodes=nodes;ensureGroups(st);
  return{st,warnings};
}

function preorder(st){
  const out=[],kids=new Map(),ids=new Set(st.nodes.map(n=>n.id));
  st.nodes.forEach(n=>{const p=ids.has(n.parent)?n.parent:'';if(!kids.has(p))kids.set(p,[]);kids.get(p).push(n);});
  const walk=p=>{(kids.get(p)||[]).forEach(n=>{out.push(n);walk(n.id);});};
  walk('');
  if(out.length<st.nodes.length)st.nodes.forEach(n=>{if(!out.includes(n))out.push(n);});
  return out;
}
function stateToCSV(st){
  const L=[];
  L.push(['#meta','title',st.meta.title],['#meta','subtitle',st.meta.subtitle],['#meta','cardwidth',st.meta.cardWidth],
    ['#meta','spacing',st.meta.spacing],['#meta','legend',st.meta.legend?'yes':'no'],['#meta','pngscale',st.meta.pngScale],['#meta','stackfrom',st.meta.stackFrom||'off']);
  usedGroups(st).forEach(g=>L.push(['#group',g,st.groups[g]]));
  L.push(FIELDS);
  preorder(st).forEach(n=>L.push(FIELDS.map(f=>n[f])));
  return L.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
}

/* ---------- Groups ---------- */
function usedGroups(st){const out=[];st.nodes.forEach(n=>{if(n.group&&!out.includes(n.group))out.push(n.group);});return out;}
function ensureGroups(st){
  usedGroups(st).forEach(g=>{
    if(st.groups[g])return;
    const taken=new Set(Object.values(st.groups).map(c=>c.toUpperCase()));
    st.groups[g]=PALETTE.find(c=>!taken.has(c))||PALETTE[Object.keys(st.groups).length%PALETTE.length];
  });
}

/* ---------- Text measurement ---------- */
const mctx=document.createElement('canvas').getContext('2d');
function tw(s,font,ls){mctx.font=font;return mctx.measureText(s).width+(ls||0)*s.length;}
function wrap(text,font,maxW,maxLines,ls){
  text=String(text||'').trim();if(!text)return[];
  const W=s=>tw(s,font,ls);const lines=[];let cur='';
  for(const w of text.split(/\s+/)){
    const t=cur?cur+' '+w:w;
    if(W(t)<=maxW){cur=t;continue;}
    if(cur)lines.push(cur);cur=w;
    while(W(cur)>maxW&&cur.length>1){let i=cur.length;while(i>1&&W(cur.slice(0,i))>maxW)i--;lines.push(cur.slice(0,i));cur=cur.slice(i);}
  }
  if(cur)lines.push(cur);
  if(lines.length>maxLines){
    const keep=lines.slice(0,maxLines);let last=keep[maxLines-1];
    while(last.length>1&&W(last+'…')>maxW)last=last.slice(0,-1);
    keep[maxLines-1]=last.replace(/\s+$/,'')+'…';return keep;
  }
  return lines;
}
function cardText(n,W){
  const inner=W-24;
  const t=wrap((n.title||'').toUpperCase(),F.title,inner,3,TITLE_LS);
  const nm=wrap(n.name||(n.kind==='vacant'?'Vacant':''),F.name,inner,2);
  const no=wrap(n.note,F.note,inner,2);
  let h=0;
  if(t.length)h+=t.length*13;
  if(nm.length){if(h)h+=5;h+=nm.length*18;}
  if(no.length){if(h)h+=4;h+=no.length*15;}
  return{t,nm,no,h};
}

/* ---------- Layout engine ---------- */
function layout(st){
  const W=st.meta.cardWidth,sp=SPACING[st.meta.spacing]||SPACING.standard,stackFrom=+st.meta.stackFrom||0;
  const nodes=st.nodes,ids=new Set(nodes.map(n=>n.id));
  const kids=new Map(nodes.map(n=>[n.id,[]])),roots=[];
  nodes.forEach(n=>{if(n.parent&&ids.has(n.parent)&&n.parent!==n.id)kids.get(n.parent).push(n);else roots.push(n);});
  const anyGroup=nodes.some(n=>n.group);const stripe=anyGroup?5:0;
  const TX=new Map();let maxH=0;
  nodes.forEach(n=>{const c=cardText(n,W);TX.set(n.id,c);maxH=Math.max(maxH,c.h);});
  let H=Math.max(64,maxH+24+stripe);H=Math.ceil(H/2)*2;
  const M=new Map(),P=new Map();
  const isSide=(k,parent)=>!!parent&&k.line==='dotted'&&kids.get(k.id).length===0;
  function measure(n,depth){
    const all=kids.get(n.id),sides=all.filter(k=>isSide(k,n)),ks=all.filter(k=>!isSide(k,n));
    const right=sides.filter((s,i)=>i%2===0),left=sides.filter((s,i)=>i%2===1);
    const R=right.length*(sp.side+W),Lx=left.length*(sp.side+W);
    const m={right,left,ks,R,Lx,sideExt:R+Lx,mode:'none'};M.set(n.id,m);
    if(!ks.length){m.w=W+R+Lx;m.h=H;m.ax=Lx+W/2;return m;}
    ks.forEach(k=>measure(k,depth+1));
    let mode=n.layout;
    if(mode!=='row'&&mode!=='column'){
      if(stackFrom&&depth>=stackFrom)mode='column';
      else{const leaves=ks.every(k=>{const km=M.get(k.id);return km.mode==='none'&&km.sideExt===0;});mode=(ks.length>=2&&leaves)?'column':'row';}
    }
    m.mode=mode;
    if(mode==='row'){
      let x=0;ks.forEach(k=>{const km=M.get(k.id);km.ox=x;x+=km.w+sp.h;});
      const cw=x-sp.h,f=M.get(ks[0].id),l=M.get(ks[ks.length-1].id);
      let ax=((f.ox+f.ax)+(l.ox+l.ax))/2;const selfL=ax-W/2-Lx,shift=selfL<0?-selfL:0;
      if(shift){ks.forEach(k=>M.get(k.id).ox+=shift);ax+=shift;}
      m.ax=ax;m.w=Math.max(cw+shift,ax+W/2+R);
      m.h=H+sp.v+Math.max(...ks.map(k=>M.get(k.id).h));
    }else{
      let y=H+sp.col,w=W+R+Lx;
      ks.forEach(k=>{const km=M.get(k.id);km.ox=Lx+sp.indent;km.oy=y;y+=km.h+sp.col;w=Math.max(w,Lx+sp.indent+km.w);});
      m.ax=Lx+W/2;m.w=w;m.h=y-sp.col;
    }
    return m;
  }
  function place(n,x,y){
    const m=M.get(n.id);const px=x+m.ax-W/2;P.set(n.id,{x:px,y});
    m.right.forEach((s,i)=>P.set(s.id,{x:px+W+sp.side+i*(W+sp.side),y}));
    m.left.forEach((s,i)=>P.set(s.id,{x:px-(i+1)*(W+sp.side),y}));
    m.ks.forEach(k=>{const km=M.get(k.id);if(m.mode==='row')place(k,x+km.ox,y+H+sp.v);else place(k,x+km.ox,y+km.oy);});
  }
  let x=0,th=0;
  roots.forEach(r=>{const m=measure(r,1);place(r,x,0);x+=m.w+sp.h*2;th=Math.max(th,m.h);});
  const tw_=roots.length?x-sp.h*2:0;
  // connectors
  const segs=[];
  const L=(x1,y1,x2,y2,dot)=>segs.push({x1,y1,x2,y2,dot});
  nodes.forEach(n=>{
    const m=M.get(n.id),p=P.get(n.id);if(!m||!p)return;
    m.right.forEach(s=>{const q=P.get(s.id);L(p.x+W,p.y+H/2,q.x,q.y+H/2,true);});
    m.left.forEach(s=>{const q=P.get(s.id);L(q.x+W,q.y+H/2,p.x,p.y+H/2,true);});
    if(!m.ks.length)return;
    const pb=p.y+H;
    if(m.mode==='row'){
      const cx=m.ks.map(k=>P.get(k.id).x+W/2),pc=p.x+W/2;
      if(m.ks.length===1&&Math.abs(cx[0]-pc)<0.5){L(pc,pb,pc,P.get(m.ks[0].id).y,m.ks[0].line==='dotted');return;}
      const mid=pb+sp.v/2;L(pc,pb,pc,mid,false);
      L(Math.min(pc,...cx),mid,Math.max(pc,...cx),mid,false);
      m.ks.forEach((k,i)=>L(cx[i],mid,cx[i],P.get(k.id).y,k.line==='dotted'));
    }else{
      const sx=p.x+sp.indent/2,last=P.get(m.ks[m.ks.length-1].id);
      L(sx,pb,sx,last.y+H/2,false);
      m.ks.forEach(k=>{const q=P.get(k.id);L(sx,q.y+H/2,q.x,q.y+H/2,k.line==='dotted');});
    }
  });
  return{W,H,stripe,P,TX,segs,treeW:tw_,treeH:th};
}

/* ---------- SVG rendering ---------- */
function kindStyle(n){
  switch(n.kind){
    case'client':return{fill:INK.clientFill,stroke:INK.clientFill,dash:'',sw:1,title:INK.clientTitle,name:'#FFFFFF',note:INK.clientTitle,italic:false};
    case'team':return{fill:INK.paper,stroke:INK.team,dash:'5 4',sw:1.5,title:INK.title,name:INK.name,note:INK.note,italic:false};
    case'external':return{fill:INK.extFill,stroke:INK.extBorder,dash:'',sw:1,title:INK.title,name:INK.name,note:INK.note,italic:false};
    case'vacant':return{fill:INK.paper,stroke:'#9AA3AC',dash:'3 3',sw:1.25,title:INK.title,name:INK.vacant,note:INK.note,italic:true};
    default:return{fill:INK.paper,stroke:INK.border,dash:'',sw:1,title:INK.title,name:INK.name,note:INK.note,italic:false};
  }
}
function build(st,opts){
  opts=opts||{};
  const lay=layout(st),{W,H,stripe,P,TX,segs}=lay;
  const MAR=40,groups=usedGroups(st);
  const hasDotted=st.nodes.some(n=>n.line==='dotted'),hasTeam=st.nodes.some(n=>n.kind==='team');
  // header
  const head=[];let hy=MAR,headW=0;
  if(st.meta.title){hy+=24;head.push('<text x="'+MAR+'" y="'+hy+'" font-size="24" font-weight="bold" fill="'+INK.head+'">'+esc(st.meta.title)+'</text>');headW=Math.max(headW,tw(st.meta.title,F.h1));hy+=6;}
  if(st.meta.subtitle){hy+=18;head.push('<text x="'+MAR+'" y="'+hy+'" font-size="14" fill="'+INK.sub+'">'+esc(st.meta.subtitle)+'</text>');headW=Math.max(headW,tw(st.meta.subtitle,F.sub));hy+=4;}
  const legend=[];
  if(st.meta.legend){
    groups.forEach(g=>legend.push({type:'sw',color:st.groups[g],text:g}));
    if(hasDotted)legend.push({type:'dot',text:'Dotted-line / advisory role'});
    if(hasTeam)legend.push({type:'team',text:'Team'});
  }
  if(legend.length){
    hy+=(head.length?16:0)+12;let lx=MAR;
    legend.forEach(it=>{
      if(it.type==='sw')head.push('<rect x="'+lx+'" y="'+(hy-10)+'" width="12" height="12" rx="2" fill="'+it.color+'"/>');
      else if(it.type==='dot')head.push('<line x1="'+lx+'" y1="'+(hy-4)+'" x2="'+(lx+20)+'" y2="'+(hy-4)+'" stroke="'+INK.dotted+'" stroke-width="1.5" stroke-dasharray="5 4"/>');
      else head.push('<rect x="'+(lx+0.75)+'" y="'+(hy-10)+'" width="18" height="12" rx="2" fill="none" stroke="'+INK.team+'" stroke-width="1.5" stroke-dasharray="4 3"/>');
      const off=it.type==='sw'?18:26;
      head.push('<text x="'+(lx+off)+'" y="'+hy+'" font-size="12" fill="'+INK.sub+'">'+esc(it.text)+'</text>');
      lx+=off+tw(it.text,F.leg)+22;
    });
    headW=Math.max(headW,lx-MAR-22);
  }
  const headH=head.length?(hy-MAR)+32:0;
  const contentW=Math.max(lay.treeW,headW,W);
  const tx=MAR+Math.max(0,(contentW-lay.treeW)/2),ty=MAR+headH;
  const sw_=Math.ceil(contentW+MAR*2),sh_=Math.ceil(ty+Math.max(lay.treeH,st.nodes.length?0:80)+MAR);
  const out=[];
  out.push('<svg xmlns="http://www.w3.org/2000/svg" width="'+sw_+'" height="'+sh_+'" viewBox="0 0 '+sw_+' '+sh_+'" font-family="'+FONT+'"'+(opts.interactive?' role="img" aria-label="Org chart"':'')+'>');
  out.push('<defs><clipPath id="cc"><rect width="'+W+'" height="'+H+'" rx="6"/></clipPath></defs>');
  out.push('<rect width="'+sw_+'" height="'+sh_+'" fill="'+INK.paper+'"/>');
  out.push(head.join(''));
  if(!st.nodes.length)out.push('<text x="'+(sw_/2)+'" y="'+(ty+40)+'" text-anchor="middle" font-size="14" fill="'+INK.sub+'">No positions yet. Use “Add top-level position” in the panel.</text>');
  out.push('<g transform="translate('+tx+','+ty+')">');
  // lines
  segs.forEach(s=>out.push('<line x1="'+s.x1+'" y1="'+s.y1+'" x2="'+s.x2+'" y2="'+s.y2+'" stroke="'+(s.dot?INK.dotted:INK.line)+'" stroke-width="1.5"'+(s.dot?' stroke-dasharray="5 4"':'')+' stroke-linecap="butt"/>'));
  // cards
  st.nodes.forEach(n=>{
    const p=P.get(n.id);if(!p)return;const c=TX.get(n.id),k=kindStyle(n);
    const g=n.group?st.groups[n.group]:null;
    const cls=opts.interactive?' class="card'+(n.id===opts.sel?' selected':'')+'" data-id="'+esc(n.id)+'"':'';
    out.push('<g'+cls+' transform="translate('+p.x+','+p.y+')">');
    if(opts.interactive)out.push('<rect class="sel-ring" x="-5" y="-5" width="'+(W+10)+'" height="'+(H+10)+'" rx="9"/><rect class="bar-l" x="-12" y="0" width="4" height="'+H+'" rx="2"/><rect class="bar-r" x="'+(W+8)+'" y="0" width="4" height="'+H+'" rx="2"/>');
    out.push('<rect class="card-bg" x="0" y="0" width="'+W+'" height="'+H+'" rx="6" fill="'+k.fill+'" stroke="'+k.stroke+'" stroke-width="'+k.sw+'"'+(k.dash?' stroke-dasharray="'+k.dash+'"':'')+'/>');
    if(g)out.push('<rect x="0" y="0" width="'+W+'" height="5" fill="'+g+'" clip-path="url(#cc)"/>');
    let y=stripe+(H-stripe-c.h)/2;const cx=W/2;
    c.t.forEach((t,i)=>out.push('<text x="'+cx+'" y="'+(y+i*13+10)+'" text-anchor="middle" font-size="10.5" font-weight="bold" letter-spacing="'+TITLE_LS+'" fill="'+k.title+'">'+esc(t)+'</text>'));
    if(c.t.length)y+=c.t.length*13+5;
    c.nm.forEach((t,i)=>out.push('<text x="'+cx+'" y="'+(y+i*18+14)+'" text-anchor="middle" font-size="15" font-weight="bold"'+(k.italic?' font-style="italic"':'')+' fill="'+k.name+'">'+esc(t)+'</text>'));
    if(c.nm.length)y+=c.nm.length*18+4;
    c.no.forEach((t,i)=>out.push('<text x="'+cx+'" y="'+(y+i*15+11)+'" text-anchor="middle" font-size="12" fill="'+k.note+'">'+esc(t)+'</text>'));
    out.push('</g>');
  });
  out.push('</g></svg>');
  return{svg:out.join(''),w:sw_,h:sh_};
}

/* ---------- Rendering the app ---------- */
function renderChart(){
  const r=build(state,{interactive:true,sel});
  board.innerHTML=r.svg;SW=r.w;SH=r.h;
  if(needFit){needFit=false;requestAnimationFrame(fit);}else applyZoom();
  $('#b-undo').disabled=!undoS.length;$('#b-redo').disabled=!redoS.length;
}
function applyZoom(){
  const s=board.querySelector('svg');if(!s)return;
  s.setAttribute('width',Math.round(SW*zoom));s.setAttribute('height',Math.round(SH*zoom));
  $('#zoom-label').textContent=Math.round(zoom*100)+'%';
}
function setZoom(z){zoom=clamp(z,0.15,3);applyZoom();}
function fit(){
  const cw=stage.clientWidth-64,ch=stage.clientHeight-64;
  if(cw<=0||ch<=0||!SW)return applyZoom();
  setZoom(Math.min(1,cw/SW,ch/SH));
}
function renderAll(){renderChart();renderInspector();}

/* ---------- Persistence & history ---------- */
function snapshot(){return JSON.stringify(state);}
function pushUndo(){undoS.push(snapshot());if(undoS.length>150)undoS.shift();redoS.length=0;}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS_KEY,snapshot());}catch(e){}},300);}
function mutate(fn){pushUndo();fn();ensureGroups(state);save();renderAll();}
function undo(){if(!undoS.length)return;redoS.push(snapshot());state=JSON.parse(undoS.pop());if(sel&&!byId(sel))sel=null;save();renderAll();}
function redo(){if(!redoS.length)return;undoS.push(snapshot());state=JSON.parse(redoS.pop());if(sel&&!byId(sel))sel=null;save();renderAll();}
function loadState(st,msg){
  if(state)pushUndo();
  state=st;sel=null;needFit=true;save();renderAll();if(msg)toast(msg);
}

/* ---------- Inspector ---------- */
function seg(name,cur,opts){
  return '<div class="seg" role="radiogroup">'+opts.map(([v,l])=>'<input type="radio" id="'+name+'-'+v+'" name="'+name+'" value="'+v+'"'+(cur===v?' checked':'')+'><label for="'+name+'-'+v+'">'+l+'</label>').join('')+'</div>';
}
function renderInspector(){
  const n=sel?byId(sel):null;
  if(n)renderNodePanel(n);else renderChartPanel();
}
function renderNodePanel(n){
  const opts=state.nodes.filter(o=>o.id!==n.id&&!inSubtree(o.id,n.id));
  const groups=usedGroups(state);
  panel.innerHTML=
   '<div class="insp-head"><span class="eyebrow">Position</span><code title="CSV id">'+esc(n.id)+'</code></div>'+
   '<div class="fld"><label for="f-name">Name</label><input type="text" id="f-name" value="'+esc(n.name)+'" autocomplete="off"></div>'+
   '<div class="fld"><label for="f-title">Title / role</label><input type="text" id="f-title" value="'+esc(n.title)+'" autocomplete="off"></div>'+
   '<div class="fld"><label for="f-note">Note line</label><input type="text" id="f-note" value="'+esc(n.note)+'" placeholder="Second role, credentials, firm" autocomplete="off"></div>'+
   '<div class="fld"><label for="f-parent">Reports to</label><select id="f-parent"><option value="">(Top of chart)</option>'+
     opts.map(o=>'<option value="'+esc(o.id)+'"'+(o.id===n.parent?' selected':'')+'>'+esc(label(o))+(o.title&&o.name?' · '+esc(o.title):'')+'</option>').join('')+'</select></div>'+
   '<div class="fld"><span class="lbl" id="l-line">Line to manager</span>'+seg('f-line',n.line,[['solid','Solid'],['dotted','Dotted / advisory']])+
     '<span class="hint">Dotted-line roles with no reports sit beside their manager, alternating right and left.</span></div>'+
   '<div class="two"><div class="fld"><label for="f-kind">Card style</label><select id="f-kind">'+KINDS.map(([v,l])=>'<option value="'+v+'"'+(n.kind===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div>'+
   '<div class="fld"><label for="f-group">Group</label><input type="text" id="f-group" list="dl-groups" value="'+esc(n.group)+'" placeholder="None" autocomplete="off"><datalist id="dl-groups">'+groups.map(g=>'<option value="'+esc(g)+'"></option>').join('')+'</datalist></div></div>'+
   '<div class="fld"><span class="lbl">Arrange direct reports</span>'+seg('f-layout',n.layout,[['auto','Auto'],['row','Side by side'],['column','Stacked']])+'</div>'+
   '<div class="btn-row"><button type="button" class="btn" id="b-prev">Move earlier</button><button type="button" class="btn" id="b-next">Move later</button></div>'+
   '<div class="divider"></div>'+
   '<div class="btn-row"><button type="button" class="btn primary" id="b-add-child">Add direct report</button><button type="button" class="btn" id="b-add-side">Add dotted-line role</button></div>'+
   '<div class="btn-row"><button type="button" class="btn" id="b-dup">Duplicate</button><button type="button" class="btn danger" id="b-del">Delete position</button></div>'+
   '<div class="divider"></div>'+
   '<button type="button" class="btn" id="b-done">Done · back to chart settings</button>';
  bindText('#f-name',v=>n.name=v,n);bindText('#f-title',v=>n.title=v,n);bindText('#f-note',v=>n.note=v,n);
  bindText('#f-group',v=>{n.group=v;ensureGroups(state);},n);
  $('#f-parent').addEventListener('change',e=>mutate(()=>{n.parent=e.target.value;moveToEnd(n);}));
  $('#f-kind').addEventListener('change',e=>mutate(()=>{n.kind=e.target.value;}));
  panel.querySelectorAll('input[name=f-line]').forEach(r=>r.addEventListener('change',e=>mutate(()=>{n.line=e.target.value;})));
  panel.querySelectorAll('input[name=f-layout]').forEach(r=>r.addEventListener('change',e=>mutate(()=>{n.layout=e.target.value;})));
  $('#b-prev').addEventListener('click',()=>shift(n,-1));
  $('#b-next').addEventListener('click',()=>shift(n,1));
  $('#b-add-child').addEventListener('click',()=>addNode(n,'solid'));
  $('#b-add-side').addEventListener('click',()=>addNode(n,'dotted'));
  $('#b-dup').addEventListener('click',()=>{const c=Object.assign({},n,{id:uid(n.id)});mutate(()=>{state.nodes.splice(state.nodes.indexOf(n)+1,0,c);sel=c.id;});toast('Duplicated '+label(n)+'.');});
  const del=$('#b-del');let armT=null;
  del.addEventListener('click',()=>{
    if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Click again to delete';armT=setTimeout(()=>{del.classList.remove('armed');del.textContent='Delete position';},3000);return;}
    clearTimeout(armT);deleteNode(n);
  });
  $('#b-done').addEventListener('click',()=>select(null));
}
function bindText(sel_,setter,node){
  const el=$(sel_);
  el.addEventListener('focus',()=>{editPending=true;});
  el.addEventListener('input',()=>{if(editPending){pushUndo();editPending=false;}setter(el.value);save();renderChart();});
}
function renderChartPanel(){
  const m=state.meta,groups=usedGroups(state);
  const counts={};state.nodes.forEach(n=>{if(n.group)counts[n.group]=(counts[n.group]||0)+1;});
  panel.innerHTML=
   '<span class="eyebrow">Chart settings</span>'+
   (state.isExample?'<div class="note-box">This is the standard template with placeholder names. Import a project CSV, or click any card to edit it.</div>':'')+
   '<div class="fld"><label for="c-title">Chart title</label><input type="text" id="c-title" value="'+esc(m.title)+'" placeholder="Project name" autocomplete="off"></div>'+
   '<div class="fld"><label for="c-sub">Subtitle</label><input type="text" id="c-sub" value="'+esc(m.subtitle)+'" placeholder="Client, project number, date" autocomplete="off"></div>'+
   '<div class="fld"><label for="c-width">Card width</label><div class="range-row"><input type="range" id="c-width" min="160" max="300" step="10" value="'+m.cardWidth+'"><output id="c-width-o" for="c-width">'+m.cardWidth+' px</output></div></div>'+
   '<div class="two"><div class="fld"><label for="c-spacing">Spacing</label><select id="c-spacing">'+['compact','standard','roomy'].map(s=>'<option value="'+s+'"'+(m.spacing===s?' selected':'')+'>'+s[0].toUpperCase()+s.slice(1)+'</option>').join('')+'</select></div>'+
   '<div class="fld"><label for="c-scale">PNG resolution</label><select id="c-scale">'+[1,2,3,4].map(s=>'<option value="'+s+'"'+(m.pngScale===s?' selected':'')+'>'+s+'×</option>').join('')+'</select></div></div>'+
   '<div class="fld"><label for="c-stack">Stack reports starting at row</label><select id="c-stack">'+[[0,'Off (auto)'],[2,'Row 2'],[3,'Row 3'],[4,'Row 4'],[5,'Row 5'],[6,'Row 6']].map(([v,l])=>'<option value="'+v+'"'+((+m.stackFrom||0)===v?' selected':'')+'>'+l+'</option>').join('')+'</select><span class="hint">Cards on this row and below list their reports vertically. A card set to Side by side or Stacked keeps its own choice.</span></div>'+
   '<label class="check" for="c-legend"><input type="checkbox" id="c-legend"'+(m.legend?' checked':'')+'> Show legend</label>'+
   '<div class="fld"><span class="lbl">Groups</span>'+
     '<datalist id="dl-aecom">'+PALETTE.map(c=>'<option value="'+c.toLowerCase()+'"></option>').join('')+'</datalist>'+
     (groups.length?'<div class="groups">'+groups.map((g,i)=>'<div class="grp"><input type="color" list="dl-aecom" id="g-c-'+i+'" value="'+esc(state.groups[g])+'" aria-label="Color for '+esc(g)+'"><input type="text" id="g-n-'+i+'" value="'+esc(g)+'" aria-label="Group name"><span class="count">'+counts[g]+'</span></div>').join('')+'</div>':'<span class="hint">Type a group name on any card to color-code it.</span>')+
   '</div>'+
   '<button type="button" class="btn" id="b-add-root">Add top-level position</button>'+
   '<div class="divider"></div>'+
   '<span class="eyebrow">How to edit</span>'+
   '<ul class="tips"><li>Click a card to edit it.</li><li>Drag a card onto another card to change who it reports to.</li><li>Drop on the left or right edge of a card to place it beside that card.</li><li><kbd>Del</kbd> removes the selected card, its reports move up a level. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.</li><li><kbd>Ctrl</kbd>+scroll zooms the chart.</li></ul>'+
   '<details class="ref"><summary>CSV format</summary>'+
   '<p>One row per position. Lines starting with <code>#meta</code> or <code>#group</code> carry chart settings, so one file holds the whole chart.</p>'+
   '<table><tbody>'+
   '<tr><td>id</td><td>Unique key. Other rows point to it in <code>parent</code>.</td></tr>'+
   '<tr><td>name</td><td>Person or team name.</td></tr>'+
   '<tr><td>title</td><td>Role, shown above the name.</td></tr>'+
   '<tr><td>parent</td><td>id (or exact name) of the manager. Blank = top.</td></tr>'+
   '<tr><td>line</td><td>solid or dotted</td></tr>'+
   '<tr><td>kind</td><td>person, client, team, external, vacant</td></tr>'+
   '<tr><td>group</td><td>Any label. Same label = same color.</td></tr>'+
   '<tr><td>layout</td><td>auto, row, column (how reports are arranged)</td></tr>'+
   '<tr><td>#meta stackfrom</td><td>Row number where reports start stacking vertically, or off.</td></tr>'+
   '<tr><td>note</td><td>Optional third line, e.g. "Deputy PM".</td></tr>'+
   '</tbody></table>'+
   '<div class="btn-row" style="margin-top:10px"><button type="button" class="btn" id="b-tpl-dl">Download template CSV</button></div></details>';
  bindText('#c-title',v=>m.title=v,null);bindText('#c-sub',v=>m.subtitle=v,null);
  const wr=$('#c-width');
  wr.addEventListener('pointerdown',()=>pushUndo());wr.addEventListener('keydown',()=>{editPending=true;});
  wr.addEventListener('input',()=>{if(editPending){pushUndo();editPending=false;}m.cardWidth=+wr.value;$('#c-width-o').textContent=wr.value+' px';save();renderChart();});
  $('#c-spacing').addEventListener('change',e=>mutate(()=>{m.spacing=e.target.value;}));
  $('#c-scale').addEventListener('change',e=>mutate(()=>{m.pngScale=+e.target.value;}));
  $('#c-legend').addEventListener('change',e=>mutate(()=>{m.legend=e.target.checked;}));
  $('#c-stack').addEventListener('change',e=>mutate(()=>{m.stackFrom=+e.target.value;}));
  groups.forEach((g,i)=>{
    $('#g-c-'+i).addEventListener('input',e=>{state.groups[g]=e.target.value.toUpperCase();save();renderChart();});
    $('#g-c-'+i).addEventListener('focus',()=>pushUndo());
    $('#g-n-'+i).addEventListener('change',e=>{const nv=e.target.value.trim();if(!nv||nv===g){e.target.value=g;return;}
      mutate(()=>{state.nodes.forEach(n=>{if(n.group===g)n.group=nv;});if(!state.groups[nv])state.groups[nv]=state.groups[g];});toast('Renamed group to '+nv+'.');});
  });
  $('#b-add-root').addEventListener('click',()=>addNode(null,'solid'));
  $('#b-tpl-dl').addEventListener('click',()=>saveText('org-chart-template.csv',TEMPLATE_CSV.replace(/\n/g,'\r\n')+'\r\n','Template CSV'));
}

/* ---------- Node operations ---------- */
function moveToEnd(n){const a=state.nodes;a.splice(a.indexOf(n),1);a.push(n);}
function shift(n,dir){
  const sibs=state.nodes.filter(o=>o.parent===n.parent);const i=sibs.indexOf(n),j=i+dir;
  if(j<0||j>=sibs.length){toast(dir<0?'Already first among its peers.':'Already last among its peers.');return;}
  mutate(()=>{const a=state.nodes,ia=a.indexOf(n),ib=a.indexOf(sibs[j]);a[ia]=sibs[j];a[ib]=n;});
}
function addNode(parent,line){
  const n={id:uid('position'),name:'',title:line==='dotted'?'Advisor':'New position',parent:parent?parent.id:'',line,kind:'person',group:parent?parent.group:'',layout:'auto',note:''};
  mutate(()=>{state.nodes.push(n);sel=n.id;state.isExample=state.isExample;});
  const f=$('#f-name');if(f)f.focus();
}
function deleteNode(n){
  mutate(()=>{state.nodes.forEach(o=>{if(o.parent===n.id)o.parent=n.parent;});state.nodes.splice(state.nodes.indexOf(n),1);sel=null;});
  toast('Deleted '+label(n)+'. Its reports moved up a level. Undo with Ctrl+Z.');
}
function select(id){
  if(sel===id)return;sel=id;
  board.querySelectorAll('.card.selected').forEach(g=>g.classList.remove('selected'));
  if(id){const g=board.querySelector('.card[data-id="'+CSS.escape(id)+'"]');if(g)g.classList.add('selected');}
  renderInspector();
}

/* ---------- Drag to reparent ---------- */
let drag=null;const ghost=$('#ghost');
board.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;const g=e.target.closest('.card');
  drag={id:g?g.dataset.id:null,x:e.clientX,y:e.clientY,active:false,target:null,zone:null};
});
window.addEventListener('pointermove',e=>{
  if(!drag||!drag.id)return;
  if(!drag.active){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.active=true;ghost.hidden=false;}
  e.preventDefault();
  ghost.style.left=(e.clientX+14)+'px';ghost.style.top=(e.clientY+12)+'px';
  board.querySelectorAll('.drop-child,.drop-before,.drop-after').forEach(g=>g.classList.remove('drop-child','drop-before','drop-after'));
  drag.target=null;
  const el=document.elementFromPoint(e.clientX,e.clientY),g=el&&el.closest?el.closest('#board .card'):null;
  const me=byId(drag.id);let hint='Drop on a card';
  if(g&&g.dataset.id!==drag.id){
    const tid=g.dataset.id,t=byId(tid),r=g.querySelector('.card-bg').getBoundingClientRect(),rx=(e.clientX-r.left)/r.width;
    const zone=rx<0.2?'before':rx>0.8?'after':'child';
    if(t&&!inSubtree(tid,drag.id)){drag.target=tid;drag.zone=zone;g.classList.add('drop-'+zone);
      hint=zone==='child'?'Reports to '+label(t):(zone==='before'?'Place before ':'Place after ')+label(t);}
    else hint='Can’t report to its own team';
  }
  ghost.innerHTML='<b>'+esc(me?label(me):'')+'</b><span>'+esc(hint)+'</span>';
},{passive:false});
window.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(!d.active){select(d.id);return;}
  ghost.hidden=true;
  board.querySelectorAll('.drop-child,.drop-before,.drop-after').forEach(g=>g.classList.remove('drop-child','drop-before','drop-after'));
  if(!d.target)return;
  const n=byId(d.id),t=byId(d.target);if(!n||!t)return;
  mutate(()=>{
    const a=state.nodes;a.splice(a.indexOf(n),1);
    if(d.zone==='child'){n.parent=t.id;a.push(n);}
    else{n.parent=t.parent;a.splice(a.indexOf(t)+(d.zone==='after'?1:0),0,n);}
    sel=n.id;
  });
  toast(d.zone==='child'?label(n)+' now reports to '+label(t)+'.':'Moved '+label(n)+' beside '+label(t)+'.');
});
window.addEventListener('pointercancel',()=>{if(drag){drag=null;ghost.hidden=true;}});

/* ---------- Files: import & export ---------- */
async function getDownloads(){try{return(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){return null;}}
function anchorDownload(filename,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Downloaded '+filename+'.');
}
async function saveFile(filename,data,fallback){
  if(!window.claude){anchorDownload(filename,data);return;}
  const dl=await getDownloads();
  if(dl){
    try{await dl.save({filename,data});toast('Saved '+filename+'.');return;}
    catch(e){const c=e&&e.code;if(c==='declined'){toast('Save cancelled.');return;}if(c==='rate_limited'){toast('A save prompt is already open.');return;}}
  }
  fallback();
}
function saveText(filename,text,what){
  saveFile(filename,text,()=>openModal(what,'<p>Saving files is not available in this view. Copy the text below and save it as <b>'+esc(filename)+'</b>.</p><textarea id="m-text" spellcheck="false" readonly>'+esc(text)+'</textarea>',[['Copy','copy'],['Close','close']]));
}
function fname(ext){return(slug(state.meta.title)||'org-chart')+(state.meta.title?'-org-chart':'')+'.'+ext;}
function exportCSV(){saveText(fname('csv'),stateToCSV(state),'Chart CSV');}
function exportSVG(){saveText(fname('svg'),build(state).svg,'Chart SVG');}
async function exportPNG(){
  const r=build(state),s=state.meta.pngScale||2;
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg);});
    const c=document.createElement('canvas');c.width=Math.round(r.w*s);c.height=Math.round(r.h*s);
    const ctx=c.getContext('2d');ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,'image/png'));
    await saveFile(fname('png'),blob,()=>openModal('Chart PNG','<p>Saving files is not available in this view. Right-click (or long-press) the image and save it.</p><img alt="Org chart image" src="'+c.toDataURL('image/png')+'">',[['Close','close']]));
  }catch(e){toast('Could not draw the PNG. Try SVG export instead.');}
}
function importText(text,source){
  try{
    const{st,warnings}=csvToState(text);
    loadState(st,'Loaded '+st.nodes.length+' positions'+(source?' from '+source:'')+'.'+(warnings.length?' '+warnings.length+' fix'+(warnings.length>1?'es':'')+': '+warnings[0]:''));
    return true;
  }catch(e){toast(e.message||'Could not read that CSV.');return false;}
}
function readFile(file){
  if(!file)return;const fr=new FileReader();
  fr.onload=()=>importText(String(fr.result),file.name);
  fr.onerror=()=>toast('Could not open that file.');
  fr.readAsText(file);
}
$('#b-import').addEventListener('click',()=>$('#file-in').click());
$('#file-in').addEventListener('change',e=>{readFile(e.target.files[0]);e.target.value='';});
let dragDepth=0;
stage.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('#drop-hint').hidden=false;e.preventDefault();}});
stage.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();});
stage.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop-hint').hidden=true;});
stage.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('#drop-hint').hidden=true;const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f);});

$('#b-exp-csv').addEventListener('click',exportCSV);
$('#b-exp-png').addEventListener('click',exportPNG);
$('#b-exp-svg').addEventListener('click',exportSVG);
$('#b-csv-edit').addEventListener('click',()=>{
  openModal('Edit as CSV','<p>Change rows here, or paste a whole CSV, then apply. Columns: id, name, title, parent, line, kind, group, layout, note.</p><textarea id="m-text" spellcheck="false" aria-label="CSV text">'+esc(stateToCSV(state))+'</textarea>',[['Copy','copy'],['Cancel','close'],['Apply changes','apply']]);
});

/* ---------- Modal ---------- */
function openModal(title,body,actions){
  $('#m-title').textContent=title;$('#m-body').innerHTML=body;
  $('#m-actions').innerHTML=actions.map(([l,a],i)=>'<button type="button" class="btn'+(a==='apply'?' primary':'')+'" data-act="'+a+'">'+esc(l)+'</button>').join('');
  $('#modal').hidden=false;const t=$('#m-text');(t||$('#m-actions button')).focus();
}
function closeModal(){$('#modal').hidden=true;}
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeModal();return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,t=$('#m-text');
  if(a==='close')closeModal();
  else if(a==='apply'){if(importText(t.value,''))closeModal();}
  else if(a==='copy'){const v=t.value;const done=()=>toast('Copied.');
    try{navigator.clipboard.writeText(v).then(done,()=>{t.select();toast('Press Ctrl+C to copy.');});}catch(err){t.select();toast('Press Ctrl+C to copy.');}}
});

/* ---------- Toolbar & keys ---------- */
$('#b-undo').addEventListener('click',undo);$('#b-redo').addEventListener('click',redo);
$('#b-zin').addEventListener('click',()=>setZoom(zoom*1.2));$('#b-zout').addEventListener('click',()=>setZoom(zoom/1.2));
$('#b-fit').addEventListener('click',fit);
stage.addEventListener('wheel',e=>{if(!(e.ctrlKey||e.metaKey))return;e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1));},{passive:false});
stage.addEventListener('click',e=>{if(!e.target.closest('.card')&&sel&&!(drag&&drag.active))select(null);});
const newMenu=$('#new-menu');
newMenu.addEventListener('click',e=>{const b=e.target.closest('[data-new]');if(!b)return;newMenu.open=false;
  if(b.dataset.new==='template'){const{st}=csvToState(TEMPLATE_CSV);st.isExample=true;loadState(st,'Loaded the standard template. Undo to go back.');}
  else{const st=blankState();st.nodes=[{id:'pm',name:'',title:'Project Manager',parent:'',line:'solid',kind:'person',group:'',layout:'auto',note:''}];loadState(st,'Started a blank chart. Undo to go back.');}
});
document.addEventListener('click',e=>{if(newMenu.open&&!newMenu.contains(e.target))newMenu.open=false;});
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return;}
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!typing&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&!typing&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(typing)return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();const n=byId(sel);if(n)deleteNode(n);}
  else if(e.key==='Escape'&&sel)select(null);
});

/* ---------- Boot ---------- */
function boot(){
  let st=null;
  try{const raw=localStorage.getItem(LS_KEY);if(raw){const p=JSON.parse(raw);if(p&&Array.isArray(p.nodes)&&p.meta)st=p;}}catch(e){}
  if(!st){st=csvToState(TEMPLATE_CSV).st;st.isExample=true;}
  st.meta=Object.assign(blankState().meta,st.meta);st.groups=st.groups||{};
  state=st;ensureGroups(state);renderAll();
}
boot();
})();
</script>
